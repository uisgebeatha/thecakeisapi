<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>thecakeisapi</title>
    <link rel="stylesheet" href="/static/styles.css?v=__THECAKEISAPI_VERSION__">
    <script src="/static/app.js?v=__THECAKEISAPI_VERSION__" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>TheCakeIsAPI</h1>
        <div class="topbar-meta">
          <span id="health" class="status">Starting</span>
          <span id="app-version" class="version-note" aria-label="Application version">v__THECAKEISAPI_VERSION__</span>
        </div>
      </header>

      <div class="content">
        <section class="browser" aria-labelledby="library-heading">
          <div class="browser-header">
            <div>
              <h2 id="library-heading">Music Library</h2>
              <p id="library-path" class="path-label">/</p>
            </div>
            <button id="up-button" class="nav-button" type="button" disabled>Up</button>
          </div>
          <p id="library-status" class="message">Checking configured music folder...</p>
          <ul id="library-list" class="library-list" aria-label="Music library"></ul>
        </section>

        <aside class="playlist-panel" aria-labelledby="queue-heading">
          <div class="queue-header">
            <div>
              <h2 id="queue-heading">Queue</h2>
              <p id="queue-status" class="message">No tracks queued.</p>
            </div>
            <button id="clear-queue-button" class="nav-button" type="button">Clear Queue</button>
          </div>
          <ol id="queue-list" class="queue-list" aria-label="Playback queue"></ol>
        </aside>
      </div>

      <footer class="player-bar">
        <section class="now-playing" aria-label="Now playing">
          <h2>Now Playing</h2>
          <p id="now-playing-title">Nothing playing</p>
          <p id="playback-status" class="message" aria-live="polite"></p>
        </section>
        <section class="output-panel" aria-label="Audio output">
          <div class="output-heading">
            <span class="output-label">Play new tracks on</span>
            <span id="active-output" class="active-output">No active output</span>
          </div>
          <fieldset id="output-selector" class="output-options">
            <legend class="visually-hidden">Playback output</legend>
            <label class="output-option">
              <input type="radio" name="playback-output" value="bose" checked>
              <span class="output-option-label">Bose SoundTouch</span>
            </label>
            <label class="output-option">
              <input type="radio" name="playback-output" value="local">
              <span class="output-option-label">Pi 4 Local</span>
            </label>
          </fieldset>
        </section>
        <section class="transport" aria-label="Playback controls">
          <button id="previous-button" class="control-button" type="button" aria-label="Previous track">Previous</button>
          <button id="play-button" class="control-button primary" type="button">Play</button>
          <button id="pause-button" class="control-button" type="button">Pause</button>
          <button id="stop-button" class="control-button" type="button">Stop</button>
          <button id="next-button" class="control-button" type="button" aria-label="Next track">Next</button>
          <button id="repeat-button" class="control-button" type="button" aria-pressed="false">
            Repeat Track
          </button>
        </section>
        <section class="timer" aria-label="Track timer">
          <span id="elapsed-time">0:00</span>
          <input id="track-progress" type="range" min="0" max="100" value="0" step="1" aria-label="Seek position">
          <span id="duration-time">--:--</span>
        </section>
      </footer>
    </main>
  </body>
</html>
