<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>thecakeisapi</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <h1>thecakeisapi</h1>
        <span id="health" class="status">Starting</span>
      </header>

      <section class="browser">
        <div class="browser-header">
          <div>
            <h2>Music Library</h2>
            <p id="library-path" class="path-label">/</p>
          </div>
          <button id="up-button" class="nav-button" type="button" disabled>Up</button>
        </div>
        <p id="library-status" class="message">Checking configured music folder...</p>
        <ul id="library-list" class="library-list" aria-label="Music library"></ul>
      </section>
    </main>
  </body>
</html>
